<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/png" href="/static/assets/rh-workflow-desk-icon.png" />
    <title>成片 · RH Workflow Desk</title>
    <link rel="stylesheet" href="/static/app.css" />
    <link rel="stylesheet" href="/static/outputs.css" />
    <script>
      (function () {
        try {
          var storedTheme = localStorage.getItem("rh-workflow-theme");
          document.documentElement.dataset.theme = storedTheme === "dark" ? "dark" : "light";
        } catch (error) {}
      }());
    </script>
    <script src="/static/motion.js"></script>
  </head>
  <body>
    <div class="app-shell outputs-shell">
      <header class="topbar">
        <a class="brand-lockup brand-home-link" href="/" aria-label="返回 RH Workflow Desk">
          <img class="brand-mark" src="/static/assets/rh-workflow-desk-icon.png" alt="" aria-hidden="true" />
          <span>
            <span class="brand-name">RH Workflow Desk</span>
            <span class="brand-subtitle">本地工作流提交台</span>
          </span>
        </a>
        <div class="topbar-actions">
          <div class="local-badge"><span class="status-dot"></span>仅本机运行</div>
          <button id="themeToggle" class="settings-button theme-toggle" type="button" aria-label="切换到夜间模式">
            <span id="themeToggleIcon" class="settings-icon" aria-hidden="true">☾</span><span id="themeToggleLabel">夜间</span>
          </button>
          <a class="settings-button focus-mode-link" href="/focus" aria-label="进入专注模式" title="进入专注模式">
            <span class="settings-icon" aria-hidden="true">▦</span><span>专注</span>
          </a>
          <a class="settings-button settings-access settings-link" href="/settings" aria-label="打开本地设置" title="打开本地设置">
            <span class="settings-icon" aria-hidden="true">⚙</span><span>设置</span>
          </a>
        </div>
      </header>
      <nav class="top-nav" aria-label="主导航">
        <a class="top-nav-link" href="/workflows">
          <span class="top-nav-content">
            <svg class="top-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1" /><rect x="14" y="14" width="7" height="7" rx="1" /><path d="M10 6.5h4a2 2 0 0 1 2 2V14" /><path d="m13 12 3 3 3-3" /></svg>
            <span class="top-nav-label">工作流</span>
          </span>
        </a>
        <a class="top-nav-link" href="/prompt">
          <span class="top-nav-content">
            <svg class="top-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 4 5 5" /><path d="M4 20 14 10" /><path d="m13 6 5 5" /><path d="m4 20 4-1 11-11-3-3L5 16l-1 4Z" /></svg>
            <span class="top-nav-label">提示词工坊</span>
          </span>
        </a>
        <a class="top-nav-link" href="/">
          <span class="top-nav-content">
            <svg class="top-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12" /><path d="m7 10 5 5 5-5" /><path d="M5 21h14" /></svg>
            <span class="top-nav-label">任务提交</span>
          </span>
        </a>
        <a class="top-nav-link active" href="/outputs" aria-current="page">
          <span class="top-nav-content">
            <svg class="top-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2" /><path d="m8 4 3 16" /><path d="m16 4-3 16" /></svg>
            <span class="top-nav-label">成片</span>
          </span>
        </a>
        <a class="top-nav-link" href="/dashboard">
          <span class="top-nav-content">
            <svg class="top-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V5" /><path d="M4 19h16" /><path d="m7 15 3-4 3 2 4-6" /><path d="M17 7h2v2" /></svg>
            <span class="top-nav-label">仪表盘</span>
          </span>
        </a>
        <a class="top-nav-link" href="/settings">
          <span class="top-nav-content">
            <svg class="top-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v2" /><path d="M12 19v2" /><path d="m4.93 4.93 1.41 1.41" /><path d="m17.66 17.66 1.41 1.41" /><path d="M3 12h2" /><path d="M19 12h2" /><path d="m4.93 19.07 1.41-1.41" /><path d="m17.66 6.34 1.41-1.41" /><circle cx="12" cy="12" r="4" /></svg>
            <span class="top-nav-label">设置</span>
          </span>
        </a>
      </nav>

      <main class="outputs-main">
        <section class="outputs-hero">
          <div>
            <div class="eyebrow">OUTPUT LIBRARY / LOCAL FILES</div>
            <h1>把所有产物，<br /><em>放在一处回看。</em></h1>
            <p>这里聚合本地任务已经生成的图片、视频、音频和文本。产物不会被复制，浏览时直接读取你设置的本地输出目录。</p>
          </div>
          <div class="outputs-hero-stat">
            <span class="outputs-stat-kicker">AVAILABLE NOW</span>
            <strong id="heroTotal">0</strong>
            <span>个本地文件</span>
            <small id="heroUpdated">等待读取任务历史</small>
          </div>
        </section>

        <section class="panel outputs-toolbar" aria-label="产物筛选">
          <div class="outputs-toolbar-top">
            <div>
              <div class="section-kicker">ALL OUTPUTS</div>
              <h2>成片库 <span id="outputCount" class="outputs-count">0</span></h2>
            </div>
            <div class="outputs-toolbar-actions">
              <button id="exportCaseOutputs" class="secondary-button button-compact case-export-button" type="button" disabled aria-label="导出所有案例" title="没有带“案例”标签的媒体文件可导出"><span aria-hidden="true">⇩</span> 导出所有案例 <span id="caseOutputCount">0</span></button>
              <button id="deleteOneStarOutputs" class="secondary-button button-compact danger-button" type="button" disabled aria-label="删除所有一星成片" title="没有一星成片可删除"><span aria-hidden="true">⌫</span> 删除一星成片 <span id="oneStarOutputCount">0</span></button>
              <a class="secondary-button button-compact tool-entry-link" href="/outputs/compare">内容对比</a>
              <button id="refreshOutputs" class="secondary-button button-compact" type="button"><span aria-hidden="true">↻</span> 刷新</button>
            </div>
          </div>
          <div class="outputs-toolbar-controls">
            <label class="outputs-search">
              <span class="sr-only">搜索产物</span>
              <input id="outputSearch" type="search" placeholder="搜索文件名或任务名称" autocomplete="off" />
              <span class="search-glyph" aria-hidden="true">⌕</span>
            </label>
            <label class="outputs-sort">
              <span>排序</span>
              <select id="outputSort">
                <option value="newest">最新生成</option>
                <option value="oldest">最早生成</option>
                <option value="name">文件名</option>
              </select>
            </label>
          </div>
          <div id="outputFilters" class="output-filter-tabs" role="tablist" aria-label="产物类型">
            <span class="output-filter-slider" aria-hidden="true"></span>
            <div id="outputRatingFilters" class="output-rating-filters" role="group" aria-label="按评分筛选">
              <button class="output-rating-filter active" type="button" data-output-rating="0" aria-pressed="true"><span>评分</span><span data-rating-count>全部</span></button>
              <button class="output-rating-filter" type="button" data-output-rating="unrated" aria-label="筛选未评分" aria-pressed="false"><span>未评分</span><span data-rating-count>0</span></button>
              <button class="output-rating-filter" type="button" data-output-rating="1" aria-label="筛选 1 星" aria-pressed="false"><span class="rating-filter-stars rating-filter-stars-1" aria-hidden="true">★</span><span data-rating-count>0</span></button>
              <button class="output-rating-filter" type="button" data-output-rating="2" aria-label="筛选 2 星" aria-pressed="false"><span class="rating-filter-stars rating-filter-stars-2" aria-hidden="true">★★</span><span data-rating-count>0</span></button>
              <button class="output-rating-filter" type="button" data-output-rating="3" aria-label="筛选 3 星" aria-pressed="false"><span class="rating-filter-stars rating-filter-stars-3" aria-hidden="true">★★★</span><span data-rating-count>0</span></button>
              <button class="output-rating-filter" type="button" data-output-rating="4" aria-label="筛选 4 星" aria-pressed="false"><span class="rating-filter-stars rating-filter-stars-4" aria-hidden="true">★★★★</span><span data-rating-count>0</span></button>
              <button class="output-rating-filter" type="button" data-output-rating="5" aria-label="筛选 5 星" aria-pressed="false"><span class="rating-filter-stars rating-filter-stars-5" aria-hidden="true">★★★★★</span><span data-rating-count>0</span></button>
            </div>
            <button class="output-filter active" type="button" data-output-type="all" role="tab" aria-selected="true">全部 <span>0</span></button>
            <button class="output-filter" type="button" data-output-type="image" role="tab" aria-selected="false">图片 <span>0</span></button>
            <button class="output-filter" type="button" data-output-type="video" role="tab" aria-selected="false">视频 <span>0</span></button>
            <button class="output-filter" type="button" data-output-type="audio" role="tab" aria-selected="false">音频 <span>0</span></button>
            <button class="output-filter" type="button" data-output-type="text" role="tab" aria-selected="false">文本 <span>0</span></button>
            <button class="output-filter" type="button" data-output-type="other" role="tab" aria-selected="false">其他 <span>0</span></button>
            <div id="outputTagFilters" class="output-tag-filters" role="group" aria-label="按标签筛选">
              <button class="output-tag-filter" type="button" data-output-tag="案例" aria-label="筛选案例" aria-pressed="false">案例</button>
              <button class="output-tag-filter" type="button" data-output-tag="H" aria-label="筛选 H 标签" aria-pressed="false">H</button>
            </div>
          </div>
        </section>

        <section id="outputGrid" class="output-grid" aria-live="polite"></section>
        <nav id="outputPagination" class="output-pagination" aria-label="成片分页" hidden></nav>
      </main>
    </div>

    <div id="outputToast" class="toast-stack" role="status" aria-live="polite" aria-atomic="false"></div>
    <div id="outputPreviewModal" class="modal-backdrop" hidden>
      <section class="output-preview-dialog dialog-panel" role="dialog" aria-modal="true" aria-labelledby="outputPreviewTitle">
        <div class="modal-heading">
          <div>
            <div class="section-kicker">OUTPUT PREVIEW</div>
            <h2 id="outputPreviewTitle">产物预览</h2>
          </div>
          <button id="closeOutputPreview" class="close-button" type="button" aria-label="关闭产物预览">×</button>
        </div>
        <div id="outputPreviewMeta" class="output-preview-meta"></div>
        <div id="outputPreviewContent" class="output-preview-content"></div>
      </section>
    </div>
    <div id="outputImportModal" class="modal-backdrop" hidden>
      <section class="output-import-dialog dialog-panel" role="dialog" aria-modal="true" aria-labelledby="outputImportTitle">
        <div class="modal-heading">
          <div>
            <div class="section-kicker">IMPORT OUTPUT</div>
            <h2 id="outputImportTitle">导入媒体</h2>
          </div>
          <button id="closeOutputImport" class="close-button" type="button" aria-label="关闭导入">×</button>
        </div>
        <p id="outputImportDescription" class="modal-description">选择任务提交页当前工作流中的文件输入节点，产物会作为该节点的本机输入。</p>
        <div id="outputImportStatus" class="output-import-status"></div>
        <div id="outputImportTargets" class="output-import-targets" role="radiogroup" aria-label="文件输入节点"></div>
        <div class="output-import-actions">
          <button id="cancelOutputImport" class="secondary-button" type="button">取消</button>
          <button id="confirmOutputImport" class="primary-button" type="button" disabled>导入媒体</button>
        </div>
      </section>
    </div>
    <div id="artifactContextMenu" class="artifact-context-menu" role="menu" aria-label="成片操作" hidden>
      <button type="button" role="menuitem" data-artifact-menu-action="upload">上传</button>
      <button type="button" role="menuitem" data-artifact-menu-action="import">导入媒体</button>
      <button type="button" role="menuitem" data-artifact-menu-action="open-folder">打开所在文件夹</button>
      <button type="button" role="menuitem" data-artifact-menu-action="delete">删除任务</button>
    </div>
    <script>window.RHMotion.startPageEnter();</script>
    <script src="/static/outputs.js"></script>
  </body>
</html>
